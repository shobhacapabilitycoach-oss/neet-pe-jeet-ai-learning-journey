.inner{

  padding:12px 18px;

  padding:8px 11px;
  border-radius:8px;
  font-size:.84rem;
  font-weight:700;
  white-space:nowrap;
}
.navbtn:hover{background:rgba(255,255,255,.09)}
.navbtn.primary{background:var(--teal);border-color:var(--teal)}
.navbtn.disabled{opacity:.35;cursor:default}
.frame-wrap{flex:1 1 auto;min-height:0;background:#fff}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
@media(max-width:850px){
  .inner{grid-template-columns:1fr;gap:8px;padding:9px 10px}
  .left,.right{justify-content:center;flex-wrap:wrap}
  .center{order:-1}
